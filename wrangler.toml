name = "pcgc"
main = "src/worker.js"
compatibility_date = "2026-04-01"

# HOSTNAME BINDING (not managed here):
#   The apex polkcountygolfcarts.com is attached to this Worker via
#   the Cloudflare dashboard's Custom Domains UI. www.* needs to be
#   attached there too — Custom Domains + wrangler `routes` can
#   collide for the same zone, so we leave both attachments to the
#   dashboard. Until www is added there, src/worker.js's www->apex
#   301 (below) never fires because no www request reaches the
#   Worker.

# Static-asset bucket: the worker calls env.ASSETS.fetch(request) for
# anything not handled by /api/booking. Directory-index resolution
# (e.g. /about-us/ -> site/about-us/index.html) happens automatically.
# not_found_handling = "404-page" makes the assets handler serve
# /404.html for any request that doesn't resolve to a real asset.
[assets]
directory = "./site"
binding = "ASSETS"
not_found_handling = "404-page"

# Stores one record per rental booking under the `booking:<ts>:<id>`
# prefix. (The name FEEDBACK_KV is kept as the binding for backwards
# compatibility with the existing namespace id.)
[[kv_namespaces]]
binding = "FEEDBACK_KV"
id = "be6aa9b721f34655b1596c8d8660097f"
